note: "Companion pack for class (b) rows. The Interim Measures (Art. 17) send providers of generative AI services with public-opinion attributes or social-mobilization capacity to the algorithm filing under the Provisions on the Administration of Algorithmic Recommendation for Internet Information Services (CAC Order No. 9, in force 2022-03-01). Art. 24 lists what is filed (the list ends 'and other information', so it is not exhaustive) and uses 'shall'. Filing within 10 working days of starting service; changes within 10 working days; deregistration within 20 working days. Field 7 comes from the Labeling Measures (in force 2025-09-01). The filing system's actual form fields were not seen. Translations are GovernanceOS working translations from the official Chinese text."
