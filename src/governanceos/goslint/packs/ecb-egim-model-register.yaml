note: "Para 6: the register(s) 'should contain at least the following information for each model', so fields 1 to 8 are 'required' in the guide's own minimum wording (it is supervisory guidance, not law). Para 6 also says the register should include models purchased from third-party vendors (field 9). Para 7 expects controls on the register and an inventory of documentation with an annual review. Para 13 (complexity labels) is part of the model risk framework and is not stated as register content, so it is 'recommended'. The July 2025 PDF linked from the row's press release is marked outdated; paras 6, 7 and 13 read the same in v4.0 and v4.1. Scope: significant institutions using internal models for Pillar 1."
