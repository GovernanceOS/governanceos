note: "Para 4.5: an FI 'should establish and maintain an accurate inventory' of AI use cases, systems or models. Para 4.7: the inventory should capture key attributes, which 'may include' the listed items, so each attribute is 'recommended' while keeping an inventory is 'expected'. Footnote 24: omitting attributes should not compromise oversight. Para 4.6 expects linkages to other inventories (footnote 23 gives identifiers as examples). Footnote 25 (to para 4.8) gives agent attributes. Under 2.5(c), an FI with low-impact AI use may instead keep an approved list of AI tools. Sections 3 and 4 apply from 2027-10-07."
