note: "Principle 1.2: a comprehensive model inventory 'should be maintained'; 1.2(c) lists the types of information it 'should capture', each followed by 'For example' items, so the four headings are 'expected' and the examples 'recommended'. SS1/23 never says 'at a minimum' for the inventory. It names no model ID, version or vendor flag; do not cite SS1/23 for those. The current PDF is dated 16 April 2026 (updating 17 May 2023); the landing page says that version was published and took effect on 23 April 2026. Principle 1 reads the same in both. Scope: UK banks, building societies and PRA-designated investment firms with internal-model approval for regulatory capital; insurers are out of scope."
